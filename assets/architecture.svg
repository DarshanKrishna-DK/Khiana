<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6E54FF"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0EA5A0"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#0E091C"/>

  <text x="34" y="46" fill="#DDD7FE" font-size="19" font-weight="700" letter-spacing="3">KHIANA ARCHITECTURE</text>
  <text x="34" y="68" fill="#8778BE" font-size="12">You see one corridor. Your advisor sees everything, and may have been paid to lie.</text>

  <!-- ── Browser tier ─────────────────────────────────────────────────── -->
  <rect x="34" y="96" width="380" height="176" rx="10" fill="#150E2B" stroke="#2C1F5C" stroke-width="2"/>
  <text x="52" y="122" fill="#85E6FF" font-size="11" font-weight="700" letter-spacing="2">BROWSER  ·  VERCEL</text>

  <rect x="52" y="138" width="164" height="52" rx="7" fill="#1E1440" stroke="#6E54FF" stroke-width="1.5"/>
  <text x="66" y="160" fill="#DDD7FE" font-size="12" font-weight="700">Player view</text>
  <text x="66" y="177" fill="#8778BE" font-size="10">three.js, one corridor</text>

  <rect x="232" y="138" width="164" height="52" rx="7" fill="#1E1440" stroke="#6E54FF" stroke-width="1.5"/>
  <text x="246" y="160" fill="#DDD7FE" font-size="12" font-weight="700">Spectator view</text>
  <text x="246" y="177" fill="#8778BE" font-size="10">full map + agent channel</text>

  <rect x="52" y="204" width="344" height="50" rx="7" fill="#1E1440" stroke="#2C1F5C" stroke-width="1.5"/>
  <text x="66" y="225" fill="#DDD7FE" font-size="12" font-weight="700">Landing + lobby browser</text>
  <text x="66" y="242" fill="#8778BE" font-size="10">create or join a room, empty seats fill with bots</text>

  <!-- ── Server tier ──────────────────────────────────────────────────── -->
  <rect x="34" y="316" width="380" height="268" rx="10" fill="#150E2B" stroke="#2C1F5C" stroke-width="2"/>
  <text x="52" y="342" fill="#85E6FF" font-size="11" font-weight="700" letter-spacing="2">GAME SERVER  ·  RAILWAY</text>

  <rect x="52" y="358" width="344" height="56" rx="7" fill="#1E1440" stroke="#6E54FF" stroke-width="1.5"/>
  <text x="66" y="379" fill="#DDD7FE" font-size="12" font-weight="700">Authoritative engine</text>
  <text x="66" y="396" fill="#8778BE" font-size="10">15s tick · fog of view · elimination · task and win rules</text>

  <rect x="52" y="426" width="344" height="56" rx="7" fill="#1E1440" stroke="#6E54FF" stroke-width="1.5"/>
  <text x="66" y="447" fill="#DDD7FE" font-size="12" font-weight="700">8 AI advisors</text>
  <text x="66" y="464" fill="#8778BE" font-size="10">deliberate in parallel, negotiate, price bribes</text>

  <rect x="52" y="494" width="344" height="72" rx="7" fill="#1E1440" stroke="#6E54FF" stroke-width="1.5"/>
  <text x="66" y="515" fill="#DDD7FE" font-size="12" font-weight="700">x402 resource server</text>
  <text x="66" y="532" fill="#8778BE" font-size="10">/x402/contact · /x402/powerup · /x402/bribe</text>
  <text x="66" y="549" fill="#8778BE" font-size="10">402 quote, verify signature, settle, burn nonce</text>

  <!-- ── Groq ─────────────────────────────────────────────────────────── -->
  <rect x="566" y="96" width="380" height="122" rx="10" fill="#150E2B" stroke="#2C1F5C" stroke-width="2"/>
  <text x="584" y="122" fill="#0EA5A0" font-size="11" font-weight="700" letter-spacing="2">GROQ</text>
  <rect x="584" y="138" width="344" height="60" rx="7" fill="#1E1440" stroke="#0EA5A0" stroke-width="1.5"/>
  <text x="598" y="159" fill="#DDD7FE" font-size="12" font-weight="700">llama-3.1-8b-instant</text>
  <text x="598" y="176" fill="#8778BE" font-size="10">every negotiation and briefing is model written</text>
  <text x="598" y="191" fill="#8778BE" font-size="10">a failed call degrades to a deterministic brain</text>

  <!-- ── Monad ────────────────────────────────────────────────────────── -->
  <rect x="566" y="262" width="380" height="322" rx="10" fill="#150E2B" stroke="#2C1F5C" stroke-width="2"/>
  <text x="584" y="288" fill="#85E6FF" font-size="11" font-weight="700" letter-spacing="2">MONAD TESTNET  ·  CHAIN 10143</text>

  <rect x="584" y="304" width="344" height="58" rx="7" fill="#1E1440" stroke="#6E54FF" stroke-width="1.5"/>
  <text x="598" y="325" fill="#DDD7FE" font-size="12" font-weight="700">KhianaCredit  ·  KHIA</text>
  <text x="598" y="342" fill="#8778BE" font-size="10">EIP-3009 ERC-20, fixed 40 supply, no mint</text>
  <text x="598" y="356" fill="#8778BE" font-size="9">0x76b558107220526fafC50B813BE56eb3D14a2CA5</text>

  <rect x="584" y="374" width="344" height="58" rx="7" fill="#1E1440" stroke="#6E54FF" stroke-width="1.5"/>
  <text x="598" y="395" fill="#DDD7FE" font-size="12" font-weight="700">KhianaEscrow</text>
  <text x="598" y="412" fill="#8778BE" font-size="10">holds a bribe, releases on engine attestation</text>
  <text x="598" y="426" fill="#8778BE" font-size="9">0x51dD09Eeb6751D334CF7aC847A5531a86d5Cc46B</text>

  <rect x="584" y="444" width="344" height="58" rx="7" fill="#1E1440" stroke="#6E54FF" stroke-width="1.5"/>
  <text x="598" y="465" fill="#DDD7FE" font-size="12" font-weight="700">PowerupShop</text>
  <text x="598" y="482" fill="#8778BE" font-size="10">burns credits, so supply shrinks all game</text>
  <text x="598" y="496" fill="#8778BE" font-size="9">0xaF49bF781754bEb0F15FEb2aa378dB72e5948075</text>

  <rect x="584" y="514" width="344" height="58" rx="7" fill="#1E1440" stroke="#6E54FF" stroke-width="1.5"/>
  <text x="598" y="535" fill="#DDD7FE" font-size="12" font-weight="700">RoleCommit</text>
  <text x="598" y="552" fill="#8778BE" font-size="10">hash of team assignments before move one</text>
  <text x="598" y="566" fill="#8778BE" font-size="9">0x1d04e66B65A7B86ee6700980e852A66447204d8F</text>

  <!-- ── Edges ────────────────────────────────────────────────────────── -->
  <line x1="224" y1="272" x2="224" y2="310" stroke="#6E54FF" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="236" y="296" fill="#85E6FF" font-size="10">WebSocket, fogged state per player</text>

  <line x1="414" y1="452" x2="560" y2="182" stroke="#0EA5A0" stroke-width="2" marker-end="url(#c)" marker-start="url(#c)"/>
  <text x="424" y="330" fill="#0EA5A0" font-size="10">8 parallel calls per tick</text>

  <line x1="414" y1="530" x2="560" y2="420" stroke="#6E54FF" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="424" y="500" fill="#85E6FF" font-size="10">engine broadcasts</text>
  <text x="424" y="514" fill="#8778BE" font-size="9">advisors sign only, never spend gas</text>
</svg>
